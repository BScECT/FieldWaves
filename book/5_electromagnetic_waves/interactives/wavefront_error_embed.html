<iframe title="Spherical versus plane-wave error at oblique incidence" style="width:100%;height:1100px;border:0" sandbox="allow-scripts" loading="lazy" srcdoc="&lt;!doctype html&gt;&lt;html lang=&quot;en&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;&gt;&lt;title&gt;Spherical versus plane-wave error at oblique incidence&lt;/title&gt;&lt;style&gt;
*{box-sizing:border-box}body{font:15px system-ui,sans-serif;color:#243743;background:white;margin:0;padding:12px}h2{font-size:20px;margin:0 0 8px}p{line-height:1.45;margin:8px 0}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}label{display:block;font-weight:600}output{font-weight:400;display:block;font-variant-numeric:tabular-nums;margin:4px 0}input{width:100%;accent-color:#008dab}.plots{display:grid;grid-template-columns:1fr 1fr;gap:12px}canvas{width:100%;height:auto;border:1px solid #d5e0e5}#geometry{display:block;width:min(100%,650px);margin:auto;border:0}.readout{font-variant-numeric:tabular-nums;font-size:16px}#phase-state{font-weight:600}button{font:inherit;padding:5px 15px;background:white;border:1px solid #78909b;border-radius:4px}.hint{font-size:14px;color:#435963}details{font-size:14px;line-height:1.6}summary{cursor:pointer}@media(max-width:620px){.plots,.controls{grid-template-columns:1fr}.controls{gap:10px}body{font-size:14px}}
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;h2&gt;When does a spherical wave stop looking planar?&lt;/h2&gt;
&lt;p&gt;A satellite illuminates a horizontal ground patch at &lt;strong&gt;30° from zenith&lt;/strong&gt;. The plane wave is tangent-matched at the patch centre: it already includes the phase slope along the ground. The error below is the curvature it misses.&lt;/p&gt;
&lt;canvas id=&quot;geometry&quot; width=&quot;780&quot; height=&quot;210&quot; aria-label=&quot;Oblique illumination at thirty degrees from zenith of a horizontal patch centred at x equals zero&quot;&gt;&lt;/canvas&gt;
&lt;div class=&quot;controls&quot;&gt;
&lt;label&gt;Source–centre distance R&lt;output id=&quot;range-label&quot;&gt;&lt;/output&gt;&lt;input id=&quot;range&quot; type=&quot;range&quot; min=&quot;2&quot; max=&quot;3.301029995663981&quot; step=&quot;any&quot; value=&quot;2.903089986991944&quot; aria-label=&quot;Source to patch centre slant distance in kilometres&quot;&gt;&lt;/label&gt;
&lt;label&gt;Ground patch half-width L&lt;output id=&quot;width-label&quot;&gt;&lt;/output&gt;&lt;input id=&quot;width&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;3.301029995663981&quot; step=&quot;any&quot; value=&quot;2.176091259055681&quot; aria-label=&quot;Ground patch half width in metres&quot;&gt;&lt;/label&gt;
&lt;label&gt;Wavelength λ&lt;output id=&quot;wavelength-label&quot;&gt;&lt;/output&gt;&lt;input id=&quot;wavelength&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;6&quot; step=&quot;1&quot; value=&quot;1&quot; aria-label=&quot;Wavelength selection&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;p class=&quot;hint&quot;&gt;Distance and patch-size sliders are logarithmic: equal moves multiply their values. Predict first: which curve changes if you choose a shorter wavelength? What if you double the patch width? The two plots have different units; use the numerical errors below them.&lt;/p&gt;
&lt;div class=&quot;plots&quot;&gt;&lt;canvas id=&quot;amplitude&quot; width=&quot;600&quot; height=&quot;340&quot; aria-label=&quot;Signed spherical amplitude departure from constant plane wave amplitude across the ground patch&quot;&gt;&lt;/canvas&gt;&lt;canvas id=&quot;phase&quot; width=&quot;600&quot; height=&quot;340&quot; aria-label=&quot;Unwrapped magnitude of phase error of the tangent plane wave across the ground patch&quot;&gt;&lt;/canvas&gt;&lt;/div&gt;
&lt;div class=&quot;readout&quot; aria-live=&quot;polite&quot;&gt;&lt;p id=&quot;amplitude-value&quot;&gt;&lt;/p&gt;&lt;p id=&quot;phase-value&quot;&gt;&lt;/p&gt;&lt;p id=&quot;phase-state&quot;&gt;&lt;/p&gt;&lt;/div&gt;
&lt;p class=&quot;hint&quot;&gt;Amplitude is normalized to the exact field at the centre. Phase error is unwrapped: we do not hide full cycles by reducing it modulo 2π. The dashed phase guide is π/4 radians (45°), our working tolerance for phase error rather than a sharp physical boundary.&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;What is being compared?&lt;/summary&gt;
&lt;p&gt;Source position: (−R sin 30°, R cos 30°). Ground points: (x, 0), with −L ≤ x ≤ L; the vertical coordinate is positive upwards.&lt;/p&gt;
&lt;p&gt;Exact source distance: r(x) = √(R² + 2Rx sin 30° + x²).&lt;br&gt;Local plane-wave distance: rₚ(x) = R + x sin 30°.&lt;br&gt;Exact amplitude / centre amplitude: R/r(x); plane-wave amplitude / centre amplitude: 1.&lt;br&gt;Signed amplitude difference: 100[R/r(x) − 1] %.&lt;br&gt;Phase-error magnitude: (2π/λ)[r(x) − rₚ(x)].&lt;/p&gt;
&lt;p&gt;This scalar propagation comparison holds source strength and its angular radiation factor fixed across the patch. It isolates spherical spreading and wavefront curvature, before surface reflection or absorption.&lt;/p&gt;
&lt;/details&gt;
&lt;p&gt;&lt;button id=&quot;reset&quot; type=&quot;button&quot;&gt;Reset&lt;/button&gt;&lt;/p&gt;
&lt;script&gt;
&quot;use strict&quot;;
const wavelengths=[.01,.03,.1,.3,1,3,10],theta=Math.PI/6,PHASE_LIMIT=Math.PI/4;
function sample(x,R,lambda){
 const rp=R+x*Math.sin(theta), r=Math.hypot(x+R*Math.sin(theta),R*Math.cos(theta));
 // Rationalized difference avoids subtracting almost equal source distances.
 const dr=x*x*Math.cos(theta)**2/(r+rp);
 return {r,rp,amplitude:100*(R/r-1),phase:2*Math.PI/lambda*dr};
}
function arrow(ctx,x1,y1,x2,y2,colour){
 ctx.strokeStyle=colour;ctx.fillStyle=colour;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();let a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-12*Math.cos(a-.4),y2-12*Math.sin(a-.4));ctx.lineTo(x2-12*Math.cos(a+.4),y2-12*Math.sin(a+.4));ctx.closePath();ctx.fill();
}
function geometry(){
 const c=document.getElementById(&#x27;geometry&#x27;).getContext(&#x27;2d&#x27;);c.clearRect(0,0,780,210);c.font=&#x27;19px system-ui&#x27;;c.fillStyle=&#x27;#243743&#x27;;c.textAlign=&#x27;left&#x27;;
 c.fillText(&#x27;Oblique illumination&#x27;,30,25);
 c.strokeStyle=&#x27;#738565&#x27;;c.lineWidth=3;c.beginPath();c.moveTo(75,178);c.lineTo(705,178);c.stroke();
 c.strokeStyle=&#x27;#009fc4&#x27;;c.lineWidth=7;c.beginPath();c.moveTo(345,178);c.lineTo(535,178);c.stroke();
 c.fillStyle=&#x27;#243743&#x27;;c.fillText(&#x27;−L&#x27;,332,204);c.fillText(&#x27;0&#x27;,433,204);c.fillText(&#x27;+L&#x27;,522,204);c.fillText(&#x27;ground x&#x27;,594,204);
 c.setLineDash([5,5]);c.strokeStyle=&#x27;#8b9ca5&#x27;;c.lineWidth=1.5;c.beginPath();c.moveTo(440,178);c.lineTo(440,32);c.stroke();c.setLineDash([]);c.fillText(&#x27;zenith&#x27;,451,40);
 arrow(c,357,34,440,178,&#x27;#007fa8&#x27;);c.fillStyle=&#x27;#007fa8&#x27;;c.fillText(&#x27;from source&#x27;,202,65);c.fillText(&#x27;R&#x27;,370,115);
 c.strokeStyle=&#x27;#647982&#x27;;c.lineWidth=1.5;c.beginPath();c.arc(440,178,67,-Math.PI/2-Math.PI/6,-Math.PI/2);c.stroke();c.fillStyle=&#x27;#243743&#x27;;c.fillText(&#x27;30°&#x27;,397,92);
}
function plot(id,fn,L,ymin,ymax,title,ylabel,colour,guide){
 const el=document.getElementById(id),c=el.getContext(&#x27;2d&#x27;),W=el.width,H=el.height,left=91,right=22,top=51,bottom=57;
 const xp=x=&gt;left+(x+L)/(2*L)*(W-left-right),yp=y=&gt;top+(ymax-y)/(ymax-ymin)*(H-top-bottom);
 c.clearRect(0,0,W,H);c.fillStyle=&#x27;#243743&#x27;;c.font=&#x27;20px system-ui&#x27;;c.textAlign=&#x27;left&#x27;;c.fillText(title,left,24);c.font=&#x27;16px system-ui&#x27;;c.fillText(ylabel,left,44);
 const fmt=y=&gt;Math.abs(y)&lt;1e-12?&#x27;0&#x27;:Number(y.toPrecision(3)).toString();
 for(let i=0;i&lt;=4;i++){let y=ymin+(ymax-ymin)*i/4;c.strokeStyle=&#x27;#e4ecef&#x27;;c.lineWidth=1;c.beginPath();c.moveTo(left,yp(y));c.lineTo(W-right,yp(y));c.stroke();c.fillStyle=&#x27;#435963&#x27;;c.textAlign=&#x27;right&#x27;;c.fillText(fmt(y),left-8,yp(y)+5);}
 for(let i=0;i&lt;=4;i++){let x=-L+2*L*i/4;c.strokeStyle=&#x27;#e4ecef&#x27;;c.beginPath();c.moveTo(xp(x),top);c.lineTo(xp(x),H-bottom);c.stroke();c.fillStyle=&#x27;#435963&#x27;;c.textAlign=&#x27;center&#x27;;c.fillText(fmt(x),xp(x),H-bottom+23);}
 function line(y,label){c.setLineDash([6,5]);c.strokeStyle=&#x27;#637c89&#x27;;c.lineWidth=1.5;c.beginPath();c.moveTo(left,yp(y));c.lineTo(W-right,yp(y));c.stroke();c.setLineDash([]);if(label){c.font=&#x27;15px system-ui&#x27;;c.textAlign=&#x27;right&#x27;;c.fillStyle=&#x27;#435963&#x27;;c.fillText(label,W-right-5,yp(y)-6);}}
 if(guide!==null&amp;&amp;guide&gt;=ymin&amp;&amp;guide&lt;=ymax)line(guide,id===&#x27;phase&#x27;?&#x27;π/4 rad&#x27;:&#x27;plane wave&#x27;);
 c.save();c.beginPath();c.rect(left,top,W-left-right,H-top-bottom);c.clip();c.strokeStyle=colour;c.lineWidth=3;c.beginPath();for(let i=0;i&lt;=700;i++){let x=-L+2*L*i/700,y=fn(x);if(i===0)c.moveTo(xp(x),yp(y));else c.lineTo(xp(x),yp(y));}c.stroke();c.restore();
 c.strokeStyle=&#x27;#718793&#x27;;c.lineWidth=1;c.strokeRect(left,top,W-left-right,H-top-bottom);c.font=&#x27;18px system-ui&#x27;;c.textAlign=&#x27;center&#x27;;c.fillStyle=&#x27;#243743&#x27;;c.fillText(&#x27;Ground displacement x (m)&#x27;,(left+W-right)/2,H-10);
}
function update(){
 const R=10**Number(document.getElementById(&#x27;range&#x27;).value)*1000,L=10**Number(document.getElementById(&#x27;width&#x27;).value),lambda=wavelengths[Number(document.getElementById(&#x27;wavelength&#x27;).value)];
 const ends=[sample(-L,R,lambda),sample(L,R,lambda)],amp=Math.max(...ends.map(s=&gt;Math.abs(s.amplitude))),phase=Math.max(...ends.map(s=&gt;s.phase));
 document.getElementById(&#x27;range-label&#x27;).value=Number((R/1000).toPrecision(4))+&#x27; km (slant distance)&#x27;;document.getElementById(&#x27;width-label&#x27;).value=Number(L.toPrecision(4))+&#x27; m (full width &#x27;+Number((2*L).toPrecision(4))+&#x27; m)&#x27;;document.getElementById(&#x27;wavelength-label&#x27;).value=lambda+&#x27; m; f ≈ &#x27;+(0.3/lambda).toPrecision(3)+&#x27; GHz&#x27;;
 plot(&#x27;amplitude&#x27;,x=&gt;sample(x,R,lambda).amplitude,L,-amp*1.15,amp*1.15,&#x27;Amplitude departure&#x27;,&#x27;Difference from plane-wave amplitude (%)&#x27;,&#x27;#007fa8&#x27;,0);
 plot(&#x27;phase&#x27;,x=&gt;sample(x,R,lambda).phase,L,0,Math.max(1.05,phase*1.18),&#x27;Phase error from curvature&#x27;,&#x27;Magnitude of unwrapped error (rad)&#x27;,&#x27;#bf6419&#x27;,PHASE_LIMIT);
 document.getElementById(&#x27;amplitude-value&#x27;).textContent=&#x27;Maximum amplitude departure: &#x27;+amp.toPrecision(3)+&#x27;% of the centre amplitude.&#x27;;
 document.getElementById(&#x27;phase-value&#x27;).textContent=&#x27;Maximum phase error: &#x27;+phase.toPrecision(3)+&#x27; rad (&#x27;+(phase*180/Math.PI).toPrecision(3)+&#x27;°), or &#x27;+(phase/(2*Math.PI)).toPrecision(3)+&#x27; cycles.&#x27;;
 document.getElementById(&#x27;phase-state&#x27;).textContent=phase&gt;=PHASE_LIMIT?&#x27;Phase error exceeds π/4 radians (45°). Compare that with the amplitude departure.&#x27;:&#x27;Phase error is below π/4 radians (45°). Try a wider patch or shorter wavelength.&#x27;;
 document.getElementById(&#x27;range&#x27;).setAttribute(&#x27;aria-valuetext&#x27;,Number((R/1000).toPrecision(4))+&#x27; kilometres&#x27;);
 document.getElementById(&#x27;width&#x27;).setAttribute(&#x27;aria-valuetext&#x27;,Number(L.toPrecision(4))+&#x27; metres half-width&#x27;);
 window.wavefrontState={R,L,lambda,amp,phase};
}
for(const id of [&#x27;range&#x27;,&#x27;width&#x27;,&#x27;wavelength&#x27;])document.getElementById(id).addEventListener(&#x27;input&#x27;,update);
document.getElementById(&#x27;reset&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{document.getElementById(&#x27;range&#x27;).value=String(Math.log10(800));document.getElementById(&#x27;width&#x27;).value=String(Math.log10(150));document.getElementById(&#x27;wavelength&#x27;).value=&#x27;1&#x27;;update();});
geometry();update();
&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
