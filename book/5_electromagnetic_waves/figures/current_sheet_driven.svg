<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title description"><title id="title">An incident wave drives a conducting sheet</title><desc id="description">A flat x-z view of an incident wave reaching a conducting sheet. The incident electric field and induced current point upward. A local vector addition shows the upward incident field plus a downward emitted field giving a smaller upward total electric field. This total local field drives the current through the sheet Ohm law.</desc><defs>
<marker id="arrow-propagation" markerWidth="8" markerHeight="8" refX="7.2" refY="4" viewBox="0 0 8 8" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#253a46"/></marker>
<marker id="arrow-electric" markerWidth="8" markerHeight="8" refX="7.2" refY="4" viewBox="0 0 8 8" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#007fa8"/></marker>
<marker id="arrow-current" markerWidth="8" markerHeight="8" refX="7.2" refY="4" viewBox="0 0 8 8" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8b467c"/></marker>
<marker id="arrow-total" markerWidth="8" markerHeight="8" refX="7.2" refY="4" viewBox="0 0 8 8" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#63823a"/></marker>
<marker id="arrow-axis" markerWidth="8" markerHeight="8" refX="7.2" refY="4" viewBox="0 0 8 8" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#647680"/></marker>
</defs><rect width="1200" height="600" fill="white"/>
<g id="driving-geometry" inkscape:groupmode="layer" inkscape:label="Incident wave and induced current">
<rect x="20" y="28" width="695" height="427" fill="#f2f7fa"/>
<rect x="619" y="91" width="12" height="329" fill="#d5dfe4"/>
<text x="244" y="101" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="normal" fill="#253a46" text-anchor="middle">Incident wave</text>
<path d="M245 286L530 286" fill="none" stroke="#253a46" stroke-width="3.2" marker-end="url(#arrow-propagation)"/>
<text x="514" y="267" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="26" fill="#253a46" text-anchor="middle">+z</text>
<path d="M245 286L245 160" fill="none" stroke="#007fa8" stroke-width="4" marker-end="url(#arrow-electric)"/>
<text x="268" y="209" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="29" fill="#007fa8" text-anchor="start">E<tspan baseline-shift="sub" font-size="18">i</tspan></text>
<circle cx="245" cy="286" r="12" fill="white" stroke="#b65e22" stroke-width="2.5"/>
<circle cx="245" cy="286" r="3.3" fill="#b65e22"/>
<text x="270" y="319" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="28" fill="#b65e22" text-anchor="start">H<tspan baseline-shift="sub" font-size="18">i</tspan></text>
<path d="M625 363L625 184" fill="none" stroke="#8b467c" stroke-width="4.5" marker-end="url(#arrow-current)"/>
<text x="648" y="228" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="30" fill="#8b467c" text-anchor="start">K</text>
<path d="M566 365L566 295" fill="none" stroke="#63823a" stroke-width="4" marker-end="url(#arrow-total)"/>
<text x="565" y="403" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="25" fill="#63823a" text-anchor="middle">E<tspan baseline-shift="sub" font-size="16">sheet</tspan></text>
<text x="625" y="447" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="24" fill="#253a46" text-anchor="middle">z = 0</text>
<path d="M86 414L86 360" fill="none" stroke="#647680" stroke-width="1.8" marker-end="url(#arrow-axis)"/>
<path d="M86 414L147 414" fill="none" stroke="#647680" stroke-width="1.8" marker-end="url(#arrow-axis)"/>
<text x="86" y="349" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="23" fill="#647680" text-anchor="middle">x</text>
<text x="158" y="421" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="23" fill="#647680" text-anchor="start">z</text>
</g>
<g id="local-addition" inkscape:groupmode="layer" inkscape:label="The total field at the sheet">
<text x="971" y="78" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#253a46" text-anchor="middle">At the sheet: add the fields</text>
<path d="M776 280L1168 280" fill="none" stroke="#cbd7dc" stroke-width="1.3"/>
<path d="M818 280L818 140" fill="none" stroke="#007fa8" stroke-width="4" marker-end="url(#arrow-electric)"/>
<text x="818" y="400" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="27" fill="#007fa8" text-anchor="middle">E<tspan baseline-shift="sub" font-size="17">i</tspan></text>
<path d="M970 280L970 350" fill="none" stroke="#007fa8" stroke-width="4" marker-end="url(#arrow-electric)"/>
<text x="970" y="400" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="27" fill="#007fa8" text-anchor="middle">E<tspan baseline-shift="sub" font-size="17">em</tspan></text>
<path d="M1122 280L1122 210" fill="none" stroke="#63823a" stroke-width="4" marker-end="url(#arrow-total)"/>
<text x="1122" y="400" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="27" fill="#63823a" text-anchor="middle">E<tspan baseline-shift="sub" font-size="17">sheet</tspan></text>
<text x="894" y="271" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="32" fill="#253a46" text-anchor="middle">+</text>
<text x="1046" y="271" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="32" fill="#253a46" text-anchor="middle">=</text>
<text x="970" y="450" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="27" fill="#253a46" text-anchor="middle">E<tspan baseline-shift="sub" font-size="18">sheet</tspan> = E<tspan baseline-shift="sub" font-size="18">i</tspan> + E<tspan baseline-shift="sub" font-size="18">emitted</tspan></text>
<text x="970" y="493" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="27" fill="#253a46" text-anchor="middle">= E<tspan baseline-shift="sub" font-size="18">i</tspan> − ηK<tspan baseline-shift="sub" font-size="18">0</tspan> / 2</text>
<text x="970" y="555" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="29" fill="#8b467c" text-anchor="middle">K<tspan baseline-shift="sub" font-size="19">0</tspan> = G<tspan baseline-shift="sub" font-size="19">s</tspan> E<tspan baseline-shift="sub" font-size="19">sheet</tspan></text>
</g>
<g id="field-guide" inkscape:groupmode="layer" inkscape:label="Magnetic-field direction guide">
<circle cx="95" cy="494" r="10" fill="white" stroke="#b65e22" stroke-width="2.5"/>
<circle cx="95" cy="494" r="3.3" fill="#b65e22"/>
<text x="116" y="501" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#253a46" text-anchor="start">Incident H: out of page (+y)</text>
</g>
</svg>