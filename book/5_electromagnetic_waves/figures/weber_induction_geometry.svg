<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">Induction in two concentric conducting loops</title>
<desc id="desc">The outer loop carries an increasing counterclockwise current. The inner loop has a clockwise induced current. A dashed line joins representative charges on the two loops to illustrate one of the pairwise interactions in Weber's description.</desc>
<defs><marker id="blue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#17659a"/></marker><marker id="orange" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b65316"/></marker></defs>
<rect width="1000" height="520" fill="white"/>
<g font-family="Arial, sans-serif" fill="#202b33">
<text x="40" y="35" font-size="24" font-weight="bold">Two fixed loops, viewed from the same side</text>
<circle cx="270" cy="270" r="170" stroke="#17659a" stroke-width="5" fill="none"/>
<circle cx="270" cy="270" r="94" stroke="#b65316" stroke-width="5" fill="none"/>
<path d="M343,86 A198,198 0 0 0 197,86" fill="none" stroke="#17659a" stroke-width="3" marker-end="url(#blue)"/>
<text x="270" y="59" text-anchor="middle" font-size="19" fill="#17659a">I₁ increasing</text>
<path d="M221,163 A118,118 0 0 1 319,163" fill="none" stroke="#b65316" stroke-width="3" marker-end="url(#orange)"/>
<text x="270" y="276" text-anchor="middle" font-size="18" fill="#b65316">Induced I₂</text>
<line x1="270" y1="100" x2="364" y2="270" stroke="#637580" stroke-width="2" stroke-dasharray="7 6"/>
<circle cx="270" cy="100" r="7" fill="#17659a" stroke="white" stroke-width="2"/>
<circle cx="364" cy="270" r="7" fill="#b65316" stroke="white" stroke-width="2"/>
<path d="M324,197 L460,154 L515,154" fill="none" stroke="#637580" stroke-width="1.5"/>
<text x="535" y="130" font-size="21" font-weight="bold">Weber's description</text>
<text x="535" y="162" font-size="18">Dashed line: one charge pair.</text>
<text x="535" y="190" font-size="18">Its force lies along the joining line.</text>
<text x="535" y="233" font-size="18">Sum the tangential force contributions</text>
<text x="535" y="261" font-size="18">from both charge streams around</text>
<text x="535" y="289" font-size="18">both loops to obtain the induced emf.</text>
<text x="535" y="337" font-size="18">The current arrows show the resulting</text>
<text x="535" y="365" font-size="18">prediction for an initially unenergized,</text>
<text x="535" y="393" font-size="18">resistive receiving loop.</text>
<text x="270" y="472" text-anchor="middle" font-size="19" fill="#17659a">Outer loop: driven current</text>
<text x="270" y="500" text-anchor="middle" font-size="19" fill="#b65316">Inner loop: receiving circuit</text>
<text x="535" y="466" font-size="16" fill="#52616b">Schematic geometry; no iron core shown.</text>
</g></svg>