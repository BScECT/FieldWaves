<text x="300" y="454" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="normal" fill="#253a46" text-anchor="middle">Area = ℓ h</text>
</g>
<g id="panel-900" inkscape:groupmode="layer" inkscape:label="Shrink h, keep ℓ fixed">
