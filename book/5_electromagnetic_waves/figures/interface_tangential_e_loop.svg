<path d="M894 301V223" fill="none" stroke="#253a46" stroke-width="2" marker-end="url(#walk)"/>
<path d="M906 210V288" fill="none" stroke="#253a46" stroke-width="2" marker-end="url(#walk)"/>
<path d="M772 327V190" fill="none" stroke="#007fa8" stroke-width="3.3" marker-end="url(#electric)"/>
<text x="755" y="258" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="27" fill="#007fa8" text-anchor="end">E<tspan baseline-shift="sub" font-size="17">1x</tspan></text>
<path d="M1028 327V190" fill="none" stroke="#007fa8" stroke-width="3.3" marker-end="url(#electric)"/>
<text x="1045" y="258" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="27" fill="#007fa8" text-anchor="start">E<tspan baseline-shift="sub" font-size="17">2x</tspan></text>
<path d="M797 160H886" fill="none" stroke="#647680" stroke-width="1"/>
<path d="M797 350H886" fill="none" stroke="#647680" stroke-width="1"/>
<path d="M805 165V345" fill="none" stroke="#647680" stroke-width="1.4" marker-start="url(#dimension)" marker-end="url(#dimension)"/>
<text x="795" y="264" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="27" fill="#647680" text-anchor="end">ℓ</text>
<path d="M894 355V380M906 355V380" fill="none" stroke="#647680" stroke-width="1"/>
<path d="M867 371H893" fill="none" stroke="#647680" stroke-width="1.4" marker-end="url(#shrink)"/>
<path d="M933 371H907" fill="none" stroke="#647680" stroke-width="1.4" marker-end="url(#shrink)"/>
<text x="900" y="419" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="25" fill="#647680" text-anchor="middle">h → 0</text>
<text x="900" y="454" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="normal" fill="#253a46" text-anchor="middle">Area → 0</text>
</g>
