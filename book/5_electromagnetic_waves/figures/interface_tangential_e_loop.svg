<circle cx="370" cy="293" r="8" fill="white" fill-opacity=".85" stroke="#b65e22" stroke-width="1.7"/><circle cx="370" cy="293" r="2.5" fill="#b65e22"/>
<path d="M260 350V160H340V350Z" fill="none" stroke="#253a46" stroke-width="2"/>
<path d="M260 301V223" fill="none" stroke="#253a46" stroke-width="2" marker-end="url(#walk)"/>
<path d="M340 210V288" fill="none" stroke="#253a46" stroke-width="2" marker-end="url(#walk)"/>
