<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title description">
<title id="title">Shrinking a Faraday loop across an interface</title>
<desc id="description">Two flat x-z views compare a rectangular loop of fixed tangential length ell and decreasing normal width h. The electric field lies along x on both sides of the interface at z equals zero. Dots show a finite magnetic field through the page. As h tends to zero the shaded loop area ell h vanishes, so the magnetic flux vanishes while the magnetic field remains finite. Clockwise traversal follows the left long side upward and the right long side downward.</desc>
<defs>
<marker id="walk" markerWidth="5" markerHeight="5" refX="4.3" refY="2.5" viewBox="0 0 5 5" orient="auto"><path d="M0 0L5 2.5L0 5Z" fill="#253a46"/></marker>
<marker id="electric" markerWidth="8" markerHeight="8" refX="7.2" refY="4" viewBox="0 0 8 8" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#007fa8"/></marker>
<marker id="dimension" markerWidth="6" markerHeight="6" refX="3" refY="3" viewBox="0 0 6 6" orient="auto-start-reverse"><path d="M6 0L0 3L6 6" fill="none" stroke="#647680" stroke-width="1"/></marker>
<marker id="shrink" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" viewBox="0 0 7 7" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#647680"/></marker>
</defs>
<rect width="1200" height="530" fill="white"/>
<g id="panel-300" inkscape:groupmode="layer" inkscape:label="A narrow loop">
<text x="300" y="35" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#253a46" text-anchor="middle">A narrow loop</text>
<rect x="35" y="63" width="265" height="338" fill="#f2f7fa"/><rect x="300" y="63" width="265" height="338" fill="#fff7ee"/>
<text x="150" y="91" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#253a46" text-anchor="middle">Medium 1</text>
<text x="450" y="91" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#253a46" text-anchor="middle">Medium 2</text>
<text x="300" y="121" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="22" fill="#253a46" text-anchor="middle">z = 0</text>
<path d="M300 130V394" fill="none" stroke="#253a46" stroke-width="1.7"/>
<rect x="260" y="160" width="80" height="190" fill="#efc38d" fill-opacity=".48" stroke="none"/>
<circle cx="230" cy="206" r="8" fill="white" fill-opacity=".85" stroke="#b65e22" stroke-width="1.7"/><circle cx="230" cy="206" r="2.5" fill="#b65e22"/>
<circle cx="280" cy="206" r="8" fill="white" fill-opacity=".85" stroke="#b65e22" stroke-width="1.7"/><circle cx="280" cy="206" r="2.5" fill="#b65e22"/>
