<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Follow a bistatic radar signal</title>
<desc id="desc">Two nearby satellites use the same centred spacecraft design with a rectangular body, two solar panels and a long radar antenna. Both observe a ground target to their right. Straight incident and scattered paths have spreading spherical wavefronts. A single-headed electric-field vector is transverse to the incident path.</desc>
<defs>
 <marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0L9 4.5L0 9Z" fill="#007fa8"/></marker>
 <marker id="orangeArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0L9 4.5L0 9Z" fill="#bf6419"/></marker>
 <marker id="darkArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0L7 3.5L0 7Z" fill="#344854"/></marker>
 <style>
 text {font-family:Arial,Helvetica,sans-serif;fill:#243744;font-size:21px}
 .title {font-size:30px;font-weight:600}
 .small {font-size:17px}
 .label {font-size:23px;font-weight:600}
 .blue {fill:#007fa8}
 .orange {fill:#a95410}
 .leader {stroke:#647982;stroke-width:1.5;fill:none}
 </style>

<!-- Reusable spacecraft: body, symmetric solar wings, centred long radar panel. -->
<g id="sarSatellite">
 <path d="M-32 0H-49M32 0H49M0 24V55" stroke="#476574" stroke-width="3" fill="none"/>
 <rect x="-32" y="-24" width="64" height="48" rx="3" fill="#e9edef" stroke="#476574" stroke-width="2"/>
 <g fill="#c9e2ee" stroke="#476574" stroke-width="2">
  <rect x="-116" y="-20" width="67" height="40"/>
  <rect x="49" y="-20" width="67" height="40"/>
 </g>
 <g stroke="#7092a2" stroke-width="1" fill="none">
  <path d="M-94-20V20M-71-20V20M-116 0H-49M71-20V20M94-20V20M49 0H116"/>
 </g>
 <rect x="-103" y="45" width="206" height="20" fill="#d7dfcf" stroke="#52664b" stroke-width="2"/>
 <path d="M-78 45V65M-52 45V65M-26 45V65M0 45V65M26 45V65M52 45V65M78 45V65" stroke="#819075" fill="none"/>
</g>

<!-- Reusable spacecraft: body, symmetric solar wings, centred long radar panel. -->
<g id="sarSatellite">
 <path d="M-32 0H-49M32 0H49M0 24V55" stroke="#476574" stroke-width="3" fill="none"/>
 <rect x="-32" y="-24" width="64" height="48" rx="3" fill="#e9edef" stroke="#476574" stroke-width="2"/>
 <g fill="#c9e2ee" stroke="#476574" stroke-width="2">
  <rect x="-116" y="-20" width="67" height="40"/>
  <rect x="49" y="-20" width="67" height="40"/>
 </g>
 <g stroke="#7092a2" stroke-width="1" fill="none">
  <path d="M-94-20V20M-71-20V20M-116 0H-49M71-20V20M94-20V20M49 0H116"/>
 </g>
 <rect x="-103" y="45" width="206" height="20" fill="#d7dfcf" stroke="#52664b" stroke-width="2"/>
 <path d="M-78 45V65M-52 45V65M-26 45V65M0 45V65M26 45V65M52 45V65M78 45V65" stroke="#819075" fill="none"/>
</g>
</defs>
<rect width="1200" height="800" fill="white"/>
<text x="55" y="49" class="title">Follow the signal: from transmission to measurement</text>
<g id="satellites">
 <use href="#sarSatellite" transform="translate(212.51 194.34) rotate(-4) scale(0.65)"/>
 <use href="#sarSatellite" transform="translate(437.51 214.34) rotate(-4) scale(0.65)"/>
 <text x="60" y="102" class="label">Transmitting satellite</text>
 <path d="M230 108L205 180" class="leader"/>
 <text x="410" y="102" class="label">Receiving satellite</text>
 <path d="M465 111L433 205" class="leader"/>
 <text x="65" y="310" class="small">Long radar antenna</text>
 <path d="M205 298L215 241" class="leader"/>
</g>
<g id="ground">
 <path d="M55 609Q260 598 448 609T817 609T1145 609L1145 655H55Z" fill="#e8eddf"/>
 <path d="M55 609Q260 598 448 609T817 609T1145 609" stroke="#758562" stroke-width="3" fill="none"/>
 <path d="M861 603L923 586L977 610L914 628Z" fill="#c9dac2" stroke="#627b54" stroke-width="2"/>
 <text x="70" y="642">Ground: soil, vegetation, ice…</text>
</g>
<g id="incident-wavefronts" fill="none" stroke="#78bdcf" stroke-width="2.5"><path d="M354.9 284.1A150 150 0 0 1 337.7 316.3"/>
<path d="M494.8 338.2A300 300 0 0 1 460.3 402.7"/>
<path d="M634.7 392.3A450 450 0 0 1 583.0 489.0"/>
<path d="M774.6 446.3A600 600 0 0 1 705.7 575.3"/></g>
<g id="scattered-wavefronts" fill="none" stroke="#d99b6c" stroke-width="2.5"><path d="M814.7 549.5A120 120 0 0 1 834.6 522.7"/>
<path d="M691.8 482.4A260 260 0 0 1 735.0 424.3"/>
<path d="M568.9 415.3A400 400 0 0 1 635.4 325.9"/>
<path d="M446.1 348.2A540 540 0 0 1 535.8 227.6"/></g>
<g id="paths">
 <path d="M232 239L905 600" stroke="#007fa8" stroke-width="3" fill="none" marker-end="url(#blueArrow)"/>
 <path d="M917 601L454 260" stroke="#bf6419" stroke-width="3" stroke-dasharray="10 7" fill="none" marker-end="url(#orangeArrow)"/>
 <text x="111" y="404" class="blue label">Outgoing pulse</text>
 <text x="111" y="432" class="small blue">Spreading from the transmitter</text>
 <path d="M365 405L461 349" class="leader"/>
 <text x="729" y="230" class="orange label">Scattered signal</text>
 <text x="729" y="258" class="small orange">Spreading from the target</text>
 <path d="M752 278L681 388" class="leader"/>
 <!-- One-headed E vector, perpendicular to the incident ray. -->
 <path d="M579 425L614 360" stroke="#344854" stroke-width="2.5" fill="none" marker-end="url(#darkArrow)"/>
 <text x="626" y="359" font-style="italic">E</text>
 <text x="407" y="493" class="small">Transverse electric field</text>
 <path d="M577 473L597 407" class="leader"/>
</g>
<g id="interaction">
 <text x="900" y="473" class="small">Interaction changes</text>
 <text x="900" y="499" class="small">amplitude, phase and polarization</text>
 <path d="M964 511L936 588" class="leader"/>
</g>
<g id="caption">
 <text x="55" y="704" class="label">A bistatic view</text>
 <text x="55" y="734" class="small">Nearby satellites transmit and receive along distinct paths to the same ground patch.</text>
 <text x="55" y="761" class="small">This geometry also connects to Paco’s research on bistatic radar.</text>
</g>
</svg>
