<title>Horizontal and vertical electric polarization at a plane boundary</title><desc>The red plane of incidence intersects a blue horizontal interface. H polarization is perpendicular to the red plane; V polarization lies in it and is perpendicular to the incident ray. Positive z points into medium 2.</desc><g id="book-annotations" inkscape:groupmode="layer" inkscape:label="Book labels (xz incidence plane, z into medium)" font-family="Arial, Helvetica, sans-serif" font-size="4.4" fill="#243743"><text x="90" y="28" transform="rotate(30 90 28)" fill="#9c2831" font-size="4.8">Plane of incidence (xz)</text><text x="34" y="88">Medium 1</text><text x="34" y="153">Medium 2</text><text x="164" y="163" transform="rotate(-30 164 163)" font-size="4">Interface z = 0</text><text x="73" y="43">k<tspan baseline-shift="sub" font-size="3.1">i</tspan></text><text x="151" y="69">k<tspan baseline-shift="sub" font-size="3.1">r</tspan></text><text x="125" y="153">k<tspan baseline-shift="sub" font-size="3.1">t</tspan></text><text x="104" y="93" text-anchor="end">θ<tspan baseline-shift="sub" font-size="3.1">i</tspan></text><text x="111" y="134" text-anchor="end">θ<tspan baseline-shift="sub" font-size="3.1">t</tspan></text><text x="83" y="116" fill="#007fa8" font-weight="bold">E<tspan baseline-shift="sub" font-size="3.1">H</tspan></text><text x="137" y="107" fill="#bd641d" font-weight="bold">E<tspan baseline-shift="sub" font-size="3.1">V</tspan></text><path d="M184,20 L200,29" fill="none" stroke="#243743" stroke-width="0.4" marker-end="url(#Arrow1Lend)" /><text x="202" y="32" font-style="italic">x</text><path d="M184,20 L168,29" fill="none" stroke="#243743" stroke-width="0.4" marker-end="url(#Arrow1Lend)" /><text x="163" y="32" font-style="italic">y</text><path d="M184,20 L184,43" fill="none" stroke="#243743" stroke-width="0.4" marker-end="url(#Arrow1Lend)" /><text x="182" y="49" font-style="italic">z</text><text x="116" y="222" text-anchor="middle" font-size="4.2" fill="#007fa8">H: E perpendicular to the plane of incidence</text><text x="116" y="230" text-anchor="middle" font-size="4.2" fill="#bd641d">V: E in the plane of incidence, perpendicular to kᵢ</text></g></svg>