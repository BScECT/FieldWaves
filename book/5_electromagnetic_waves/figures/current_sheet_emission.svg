<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title description"><title id="title">A current sheet generates two outgoing waves</title><desc id="description">A flat x-z view. An upward surface current at z equals zero produces downward electric fields on both sides. The left magnetic field is out of the page and the right magnetic field is into the page. Their cross products give leftward and rightward propagation.</desc><defs>
<marker id="arrow-propagation" markerWidth="8" markerHeight="8" refX="7.2" refY="4" viewBox="0 0 8 8" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#253a46"/></marker>
<marker id="arrow-electric" markerWidth="8" markerHeight="8" refX="7.2" refY="4" viewBox="0 0 8 8" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#007fa8"/></marker>
<marker id="arrow-current" markerWidth="8" markerHeight="8" refX="7.2" refY="4" viewBox="0 0 8 8" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8b467c"/></marker>
<marker id="arrow-total" markerWidth="8" markerHeight="8" refX="7.2" refY="4" viewBox="0 0 8 8" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#63823a"/></marker>
<marker id="arrow-axis" markerWidth="8" markerHeight="8" refX="7.2" refY="4" viewBox="0 0 8 8" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#647680"/></marker>
</defs><rect width="1200" height="600" fill="white"/>
<g id="medium" inkscape:groupmode="layer" inkscape:label="Uniform background and sheet">
<rect x="20" y="28" width="1160" height="426" fill="#f2f7fa"/>
<text x="600" y="67" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="normal" fill="#253a46" text-anchor="middle">Same medium on both sides: impedance η</text>
<rect x="594" y="135" width="12" height="290" fill="#d5dfe4"/>
<text x="600" y="117" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#253a46" text-anchor="middle">Current sheet</text>
<path d="M600 360L600 196" fill="none" stroke="#8b467c" stroke-width="4.5" marker-end="url(#arrow-current)"/>
<text x="625" y="235" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="30" fill="#8b467c" text-anchor="start">K</text>
<text x="600" y="480" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="25" fill="#253a46" text-anchor="middle">z = 0</text>
</g>
<g id="emitted-1" inkscape:groupmode="layer" inkscape:label="Outgoing wave 1">
<text x="310" y="149" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="normal" fill="#253a46" text-anchor="middle">Emitted wave</text>
<path d="M310 275L93 275" fill="none" stroke="#253a46" stroke-width="3.2" marker-end="url(#arrow-propagation)"/>
<text x="115" y="255" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="26" fill="#253a46" text-anchor="middle">−z</text>
<path d="M310 275L310 384" fill="none" stroke="#007fa8" stroke-width="4" marker-end="url(#arrow-electric)"/>
<text x="333" y="351" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="29" fill="#007fa8" text-anchor="start">E<tspan baseline-shift="sub" font-size="18">em</tspan></text>
<circle cx="310" cy="275" r="12" fill="white" stroke="#b65e22" stroke-width="2.5"/>
<circle cx="310" cy="275" r="3.3" fill="#b65e22"/>
<text x="333" y="307" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="28" fill="#b65e22" text-anchor="start">H<tspan baseline-shift="sub" font-size="18">1</tspan></text>
</g>
<g id="emitted-2" inkscape:groupmode="layer" inkscape:label="Outgoing wave 2">
<text x="890" y="149" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="normal" fill="#253a46" text-anchor="middle">Emitted wave</text>
<path d="M890 275L1107 275" fill="none" stroke="#253a46" stroke-width="3.2" marker-end="url(#arrow-propagation)"/>
<text x="1085" y="255" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="26" fill="#253a46" text-anchor="middle">+z</text>
<path d="M890 275L890 384" fill="none" stroke="#007fa8" stroke-width="4" marker-end="url(#arrow-electric)"/>
<text x="913" y="351" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="29" fill="#007fa8" text-anchor="start">E<tspan baseline-shift="sub" font-size="18">em</tspan></text>
<circle cx="890" cy="275" r="12" fill="white" stroke="#b65e22" stroke-width="2.5"/>
<path d="M884.84 269.84L895.16 280.16M884.84 280.16L895.16 269.84" fill="none" stroke="#b65e22" stroke-width="2.5" stroke-linecap="round"/>
<text x="913" y="307" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="28" fill="#b65e22" text-anchor="start">H<tspan baseline-shift="sub" font-size="18">2</tspan></text>
</g>
<g id="axes-and-legend" inkscape:groupmode="layer" inkscape:label="Coordinate and magnetic direction guides">
<path d="M90 419L90 365" fill="none" stroke="#647680" stroke-width="1.8" marker-end="url(#arrow-axis)"/>
<path d="M90 419L151 419" fill="none" stroke="#647680" stroke-width="1.8" marker-end="url(#arrow-axis)"/>
<text x="90" y="354" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="23" fill="#647680" text-anchor="middle">x</text>
<text x="162" y="426" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="23" fill="#647680" text-anchor="start">z</text>
<circle cx="246" cy="562" r="11" fill="white" stroke="#b65e22" stroke-width="2.5"/>
<circle cx="246" cy="562" r="3.3" fill="#b65e22"/>
<text x="267" y="570" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#253a46" text-anchor="start">out of page (+y)</text>
<circle cx="780" cy="562" r="11" fill="white" stroke="#b65e22" stroke-width="2.5"/>
<path d="M775.27 557.27L784.73 566.73M775.27 566.73L784.73 557.27" fill="none" stroke="#b65e22" stroke-width="2.5" stroke-linecap="round"/>
<text x="802" y="570" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#253a46" text-anchor="start">into page (−y)</text>
</g>
<g id="amplitudes" inkscape:groupmode="layer" inkscape:label="Equal electric amplitudes">
<text x="600" y="521" font-family="STIX Two Math, DejaVu Serif, serif" font-style="italic" font-size="29" fill="#253a46" text-anchor="middle">E<tspan baseline-shift="sub" font-size="19">em,x</tspan>(0) = −ηK<tspan baseline-shift="sub" font-size="19">0</tspan> / 2</text>
</g>
</svg>