  <title
     id="title">Cross-section of an off-centre spherical cavity</title>
  <desc
     id="description">
    A circular cross-section of a uniform sphere contains an empty spherical cavity displaced from the origin.
    The diagram labels the sphere radius R, cavity radius a, cavity-centre vector d, observation vector r,
    and relative vector r minus d from the cavity centre to an observation point inside the cavity.
  </desc>
  <defs
     id="defs21">
    <marker
       id="axis-arrow"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerUnits="userSpaceOnUse"
       markerWidth="14"
       markerHeight="14"
       orient="auto">
      <path
         d="M 0 0 L 10 5 L 0 10 z"
         fill="#555b62"
         id="path4" />
    </marker>
    <marker
       id="blue-arrow"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerUnits="userSpaceOnUse"
       markerWidth="18"
       markerHeight="18"
       orient="auto">
      <path
         d="M 0 0 L 10 5 L 0 10 z"
         fill="#1769e8"
         id="path7" />
    </marker>
    <marker
       id="orange-arrow"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerUnits="userSpaceOnUse"
       markerWidth="18"
       markerHeight="18"
       orient="auto">
      <path
         d="M 0 0 L 10 5 L 0 10 z"
         fill="#b85c00"
         id="path10" />
    </marker>
    <marker
       id="green-arrow"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerUnits="userSpaceOnUse"
       markerWidth="18"
       markerHeight="18"
       orient="auto">
      <path
         d="M 0 0 L 10 5 L 0 10 z"
         fill="#16852a"
         id="path13" />
    </marker>
    <marker
       id="dimension-arrow"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerUnits="userSpaceOnUse"
       markerWidth="14"
       markerHeight="14"
       orient="auto-start-reverse">
      <path
         d="M 0 0 L 10 5 L 0 10 z"
         fill="#262a2e"
         id="path16" />
    </marker>
    <style
       id="style19">
      .axis { fill: none; stroke: #737a82; stroke-width: 3; marker-end: url(#axis-arrow); }
      .outer-sphere { fill: #e7edf2; stroke: #262a2e; stroke-width: 5; }
      .cavity { fill: #ffffff; stroke: #b33f49; stroke-width: 5; }
      .position { fill: none; stroke: #1769e8; stroke-width: 6; marker-end: url(#blue-arrow); }
      .offset { fill: none; stroke: #b85c00; stroke-width: 6; marker-end: url(#orange-arrow); }
      .relative { fill: none; stroke: #16852a; stroke-width: 7; marker-end: url(#green-arrow); }
      .dimension { fill: none; stroke: #262a2e; stroke-width: 4; stroke-dasharray: 10 8; marker-end: url(#dimension-arrow); }
      .leader { fill: none; stroke: #737a82; stroke-width: 3; }
      .centre { fill: #161616; }
      .point { fill: #16852a; stroke: #ffffff; stroke-width: 3; }
      .math { font-family: &quot;STIX Two Math&quot;, &quot;Times New Roman&quot;, serif; font-size: 42px; font-style: italic; }
      .small-math { font-family: &quot;STIX Two Math&quot;, &quot;Times New Roman&quot;, serif; font-size: 36px; font-style: italic; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 31px; fill: #202428; }
      .small-label { font-family: Arial, Helvetica, sans-serif; font-size: 27px; fill: #40464c; }
      .axis-label { font-family: &quot;STIX Two Math&quot;, &quot;Times New Roman&quot;, serif; font-size: 38px; font-style: italic; fill: #40464c; }
    </style>
  </defs>
  <!-- Coordinate axes through the centre O of the complete sphere. -->
  <!-- Circular cross-sections of the complete sphere and cavity. -->
  <circle
     class="outer-sphere"
     cx="400"
     cy="420"
     r="320"
     id="circle33" />
  <circle
     class="cavity"
     cx="570"
     cy="300"
     r="95"
     id="circle35" />
  <circle
     class="point"
     cx="620"
     cy="345"
     r="12"
     id="circle61" />
  <!-- Radius of the complete sphere. -->
  <path
     class="dimension"
     d="M 400 420 L 174 646"
     id="path37" />
  <text
     class="math"
     x="258.14767"
     y="528.03369"
     fill="#262a2e"
     id="text39">R</text>
  <!-- Radius of the cavity, deliberately separated from the relative-position vector. -->
  <path
     class="dimension"
     d="M 570 300 L 515 222"
     id="path41" />
  <text
     class="math"
     x="540.30499"
     y="256.4061"
     fill="#262a2e"
     id="text43">a</text>
  <!-- Position vectors. Draw r first so d and r-d remain easy to distinguish. -->
  <path
     class="position"
     d="M 400 420 L 620 345"
     id="path45" />
  <text
     class="math"
     x="493.11395"
     y="428.29855"
     fill="#1769e8"
     id="text47">r⃗</text>
  <path
     class="offset"
     d="M 400 420 L 570 300"
     id="path49" />
  <text
     class="math"
     x="441.25842"
     y="364.67096"
     fill="#b85c00"
     id="text51">d⃗</text>
  <path
     class="relative"
     d="M 570 300 L 620 345"
     id="path53" />
  <text
     class="small-math"
     x="595.25519"
     y="317.33228"
     fill="#16852a"
     id="text55">r⃗ - d⃗</text>
  <!-- Centres and observation point. -->
  <circle
     class="centre"
     cx="400"
     cy="420"
     r="10"
     id="circle57" />
  <circle
     class="centre"
     cx="570"
     cy="300"
     r="10"
     id="circle59" />
  <text
     class="math"
     x="396.59711"
     y="462.2215"
     fill="#161616"
     id="text63">O</text>
  <text
     class="math"
     x="569.70789"
     y="290.88925"
     fill="#161616"
     id="text65">C</text>
  <text
     class="math"
     x="640"
     y="380"
     fill="#161616"
     id="text67">P</text>
  <!-- Material labels and leaders. -->
  <text
     class="label"
     x="232.86517"
     y="187.15088"
     id="text69">uniform material</text>
  <text
     class="math"
     x="323.34833"
     y="218.85233"
     fill="#202428"
     id="text73">ρ<tspan
   baseline-shift="sub"
   font-size="27px"
   id="tspan71">0</tspan></text>
  <path
     class="leader"
     d="m 629.38425,225.60758 137.76151,-90.48973 h 67.83711"
     id="path75" />
  <text
     class="label"
     x="787.39966"
     y="117.29534"
     id="text77">empty cavity</text>
  <text
     class="small-math"
     x="787.39966"
     y="166.29535"
