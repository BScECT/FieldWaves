  <title
     id="title">Comparison of gravitational and electric flux</title>
  <desc
     id="desc">A positive mass has inward gravity arrows and a positive charge has outward electric field arrows across outward-oriented circular surfaces.</desc>
  <defs
     id="defs18">
    <marker
       id="greyArrow"
       markerWidth="7"
       markerHeight="7"
       refX="6.5"
       refY="3.5"
       orient="auto">
      <path
         d="M0,0 L7,3.5 L0,7 z"
         fill="#59636e"
         id="path4" />
    </marker>
    <marker
       id="blueArrow"
       markerWidth="7"
       markerHeight="7"
       refX="6.5"
       refY="3.5"
       orient="auto">
      <path
         d="M0,0 L7,3.5 L0,7 z"
         fill="#1769aa"
         id="path7" />
    </marker>
    <marker
       id="areaArrow"
       markerWidth="8"
       markerHeight="8"
       refX="7.5"
       refY="4"
       orient="auto">
      <path
         d="M0,0 L8,4 L0,8 z"
         fill="#9aa2a9"
         id="path10" />
    </marker>
    <marker
       id="mathArrow"
       markerWidth="7"
       markerHeight="7"
       refX="6"
       refY="3.5"
       orient="auto">
      <path
         d="M 0,0 7,3.5 0,7 Z"
         fill="#202428"
         id="path13" />
    </marker>
    <style
       id="style16">
